{% extends "base.html" %}
{% block content %}
    <h2>Account Profile Settings</h2>
    <p>Manage your account authentication credentials below. Leave fields blank if you do not want to alter them.</p>
    
    <div style="background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd; max-width: 400px; margin-top: 20px;">
        <form method="POST">
            <h3 style="margin-top: 0;">Update Credentials</h3>
            
            <p>
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Username</label>
                <input type="text" name="username" value="{{ user.username }}" required style="width: 100%; padding: 8px; box-sizing: border-box;">
            </p>
            
            <p>
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Change Password (Optional)</label>
                <input type="password" name="password" placeholder="Enter new password" style="width: 100%; padding: 8px; box-sizing: border-box;">
            </p>
            
            <button type="submit" style="background: #007BFF; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%;">
                Save Profile Changes
            </button>
        </form>
    </div>
{% endblock %}
